
name: Integrin Adhesome Analysis CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: integrin_adhesome_analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: integrin_adhesome_analysis/config/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r config/requirements.txt
          python -m pip install pytest

      - name: Verify dependencies
        run: |
          python --version
          python -c "import Bio, openpyxl; print('Dependencies OK')"

      - name: Run workflow tests
        run: |
          python -m pytest tests/ -v

      - name: Test post hoc Stage 2 refinement
        run: python -B -m unittest discover -s ../schisto_pfam_cdd_reclassify/tests -v
 
